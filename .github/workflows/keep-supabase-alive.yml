# MOD-OPS-001 | جلوگیری از توقف خودکار Supabase
#
# Supabase در پلن رایگان پروژه‌ای را که ۷ روز فعالیتی نداشته باشد
# متوقف می‌کند. این یک بار اتفاق افتاد و برنامه از کار افتاد.
#
# ── چرا این نسخه چند نقطه را امتحان می‌کند ──
# نسخه‌ی اول فقط /rest/v1/ را با کلید anon می‌زد و مدام ۴۰۱ می‌داد.
# کپی کردن یک رشته‌ی ۲۰۸ کاراکتری در موبایل بدون افتادن کاراکتر یا
# اضافه شدن فاصله عملاً سخت است، و چون Secret ها پس از ثبت قابل
# مشاهده نیستند، راهی برای دیدن اشتباه وجود ندارد.
#
# این نسخه چند نقطه را پشت‌سرهم امتحان می‌کند — بعضی بدون کلید کار
# می‌کنند. **موفقیت هر کدام کافی است**، چون هدف فقط «زدن یک درخواست
# واقعی به پروژه» است تا شمارنده‌ی بی‌فعالیتی صفر شود.
#
# اگر Secret ها تنظیم شده باشند، از آن‌ها هم استفاده می‌شود؛ اگر نه،
# workflow باز هم کار می‌کند. یعنی تنظیم Secret اختیاری است.

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

env:
  PROJECT_REF: gkxkihdibkmpryopbkkz

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: پینگ به سوپابیس
        run: |
          BASE="https://${PROJECT_REF}.supabase.co"
          SUCCESS=0

          try_ping () {
            LABEL="$1"; URL="$2"; shift 2
            CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
              --max-time 30 "$@" "$URL" || echo "000")
            echo "  $LABEL → $CODE"
            # هر پاسخ ۲xx یا ۴۰۴ یعنی سرور زنده بود و درخواست را
            # پردازش کرد. محتوای پاسخ مهم نیست، رسیدن آن مهم است.
            case "$CODE" in
              2*|404) SUCCESS=1 ;;
            esac
          }

          echo "بدون کلید:"
          try_ping "auth/health"   "${BASE}/auth/v1/health"
          try_ping "auth/settings" "${BASE}/auth/v1/settings"

          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "با کلید (در صورت وجود Secret):"
            try_ping "rest/v1" "${BASE}/rest/v1/" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
          fi

          if [ "$SUCCESS" = "1" ]; then
            echo "✅ سوپابیس فعال است — پروژه متوقف نخواهد شد"
            exit 0
          fi

          echo "::error::هیچ نقطه‌ای پاسخ سالم نداد"
          echo "::error::یا پروژه متوقف شده، یا شبکه مشکل دارد."
          echo "::error::داشبورد: https://supabase.com/dashboard/project/${PROJECT_REF}"
          cat /tmp/body.txt || true
          exit 1
