# MOD-OPS-001 | جلوگیری از توقف خودکار Supabase
#
# چرا این فایل وجود دارد:
# Supabase در پلن رایگان پروژه‌ای را که ۷ روز هیچ فعالیتی نداشته باشد
# **متوقف می‌کند**. این دقیقاً یک‌بار اتفاق افتاد و برنامه بالا نیامد.
#
# برای یک کلینیک واقعی این خطرناک است: اگر یک هفته تعطیل باشید،
# روز اول کاری برنامه کار نمی‌کند و کسی نمی‌داند چرا.
#
# نکته‌ی مهم (جستجوشده، نه فرض): صرفِ باز کردن آدرس سایت به‌عنوان
# «فعالیت» حساب نمی‌شود — باید یک درخواست واقعی به API زده شود.
#
# چرا هر ۳ روز و نه ۷:
# اگر دقیقاً روی مرز ۷ روز تنظیم شود، یک اجرای ناموفق (قطعی گیت‌هاب،
# مشکل شبکه) یعنی پروژه متوقف می‌شود. با فاصله‌ی ۳ روز، دو اجرای
# پشت‌سرهم می‌تواند شکست بخورد و باز هم وقت داریم.

name: Keep Supabase Alive

on:
  schedule:
    # ساعت ۶ صبح UTC هر ۳ روز
    - cron: '0 6 */3 * *'
  # امکان اجرای دستی از تب Actions، برای وقتی که بخواهید فوراً بیدارش کنید
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: پینگ به REST API سوپابیس
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL یا SUPABASE_ANON_KEY در GitHub Secrets تنظیم نشده است"
            exit 1
          fi

          # -f باعث می‌شود curl روی خطای HTTP کد خروج غیرصفر بدهد، پس
          # اگر پروژه واقعاً متوقف یا کلید نامعتبر باشد، این مرحله شکست
          # می‌خورد و در تب Actions قرمز دیده می‌شود — به‌جای اینکه
          # بی‌صدا هیچ کاری نکند و ما فکر کنیم همه‌چیز سالم است.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")

          echo "کد پاسخ: $HTTP_CODE"

          # ۲۰۰ یا ۴۰۴ هر دو یعنی سرور زنده است و درخواست را پردازش کرد.
          # آنچه مهم است «رسیدن درخواست» است، نه محتوای پاسخ.
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "✓ سوپابیس فعال است"
          else
            echo "::error::سوپابیس پاسخ غیرمنتظره داد ($HTTP_CODE) — ممکن است متوقف شده باشد"
            exit 1
          fi
