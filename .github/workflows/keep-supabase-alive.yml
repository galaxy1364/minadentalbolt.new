# MOD-OPS-001 | جلوگیری از توقف خودکار Supabase
#
# Supabase در پلن رایگان پروژه‌ای را که ۷ روز فعالیتی نداشته باشد
# متوقف می‌کند. این یک بار اتفاق افتاد و برنامه از کار افتاد.
#
# نکته (جستجوشده، نه فرض): باز کردن آدرس سایت به‌عنوان «فعالیت»
# حساب نمی‌شود — باید درخواست واقعی به API زده شود.
#
# چرا هر ۳ روز و نه ۷: اگر روی مرز ۷ روز باشد، یک اجرای ناموفق
# یعنی توقف پروژه. با ۳ روز، دو شکست پشت‌سرهم هم قابل جبران است.

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: بررسی Secret ها
        run: |
          MISSING=0
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL تنظیم نشده است"; MISSING=1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_ANON_KEY تنظیم نشده است"; MISSING=1
          fi
          if [ "$MISSING" = "1" ]; then exit 1; fi

          # طول کلید بدون افشای خودش گزارش می‌شود. کلید صحیح ۲۰۸
          # کاراکتر است؛ عدد متفاوت یعنی موقع کپی چیزی افتاده یا
          # فاصله اضافه شده — رایج‌ترین علت خطای ۴۰۱.
          KEY_LEN=$(printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | wc -c)
          echo "طول کلید ثبت‌شده: $KEY_LEN  (انتظار: 208)"
          if [ "$KEY_LEN" -ne 208 ]; then
            echo "::warning::طول کلید فرق دارد — احتمالاً ناقص یا دارای فاصله است"
          fi

          echo "آدرس ثبت‌شده: ${{ secrets.SUPABASE_URL }}"

      - name: پینگ به REST API
        run: |
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")

          echo "کد پاسخ: $HTTP_CODE"

          case "$HTTP_CODE" in
            200|404)
              echo "✅ سوپابیس فعال است — پروژه متوقف نخواهد شد"
              ;;
            401|403)
              # سرور زنده است و درخواست را گرفت، ولی کلید را نپذیرفت.
              # پیام قبلی می‌گفت «شاید متوقف شده» که گمراه‌کننده بود.
              echo "::error::کلید نامعتبر ($HTTP_CODE) — سرور زنده است ولی کلید پذیرفته نشد"
              echo "::error::Secret به نام SUPABASE_ANON_KEY را حذف و دوباره بسازید"
              cat /tmp/body.txt
              exit 1
              ;;
            000)
              echo "::error::هیچ پاسخی نیامد — آدرس اشتباه است یا شبکه مشکل دارد"
              exit 1
              ;;
            *)
              echo "::error::پاسخ غیرمنتظره ($HTTP_CODE) — احتمالاً پروژه متوقف شده"
              cat /tmp/body.txt
              exit 1
              ;;
          esac
