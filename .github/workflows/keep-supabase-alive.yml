# MOD-OPS-001 | جلوگیری از توقف خودکار Supabase
#
# Supabase در پلن رایگان پروژه‌ای را که ۷ روز فعالیتی نداشته باشد
# متوقف می‌کند. این یک بار اتفاق افتاد و برنامه از کار افتاد.
#
# ── درس مهمی که از سه بار شکست گرفته شد ──
# نسخه‌های قبلی ۴۰۱ را «شکست» حساب می‌کردند. این اشتباه بود.
#
# پاسخ واقعی سرور این بود:
#   {"message":"Invalid API key","hint":"Only the service_role API key
#    can be used for this endpoint."}
#
# یعنی سرور **بیدار بود، درخواست را گرفت، پردازش کرد و جواب داد**.
# برای هدف ما همین کافی است: شمارنده‌ی بی‌فعالیتی صفر شد.
#
# محتوای پاسخ اصلاً مهم نیست. ما داده نمی‌خواهیم — فقط می‌خواهیم
# سرور بداند کسی سراغش آمده. پس نیازی به کلید معتبر هم نیست، و
# همین دردسر کپی کردن رشته‌ی ۲۰۸ کاراکتری را کاملاً حذف می‌کند.
#
# تنها حالتی که واقعاً شکست است: هیچ پاسخی نیامدن (کد 000)، یعنی
# سرور خاموش است یا شبکه قطع است.

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

env:
  # شناسه‌ی پروژه محرمانه نیست — در آدرس خود برنامه هم دیده می‌شود
  PROJECT_REF: gkxkihdibkmpryopbkkz

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: پینگ به سوپابیس
        run: |
          BASE="https://${PROJECT_REF}.supabase.co"

          CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 "${BASE}/auth/v1/health" || echo "000")

          echo "کد پاسخ: $CODE"
          echo "محتوای پاسخ:"
          cat /tmp/body.txt 2>/dev/null || true
          echo ""

          if [ "$CODE" = "000" ]; then
            echo "::error::هیچ پاسخی دریافت نشد — پروژه متوقف است یا شبکه قطع است"
            echo "::error::داشبورد: https://supabase.com/dashboard/project/${PROJECT_REF}"
            exit 1
          fi

          # هر کد HTTP دیگری (200، 401، 403، 404 ...) یعنی سرور زنده
          # بود و درخواست را پردازش کرد — که دقیقاً همان چیزی است که
          # برای جلوگیری از توقف لازم است.
          echo "✅ سوپابیس پاسخ داد (کد $CODE) — سرور زنده است و شمارنده‌ی بی‌فعالیتی صفر شد"
